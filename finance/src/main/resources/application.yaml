spring:
  application:
    name: finance
  config:
    import: optional:file:.env[.properties]

  flyway: #flyway automatically uses the datasource from the application to connect to the DB
    enabled: true # enables flyway database migration
    locations: classpath:db/migration/structure, classpath:db/migration/data # the location where flyway should look for migration scripts
    validate-on-migrate: true
    default-schema: finance

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: none
    show-sql: true

  datasource:
    url: jdbc:mysql://LAPTOP-EENRFF17:3306/finance
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

finance:
  ai:
    base-url: ${AI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-3.5-flash-lite}
