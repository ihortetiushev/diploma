<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Прогноз</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link th:href="@{/css/index.css}" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h3>Персональні фінанси</h3>
        <nav>
            <ul>
                <li><a href="/">Витрати</a></li>
                <li><a href="/income">Доходи</a></li>
                <li><a href="/assets">Активи</a></li>
                <li><a href="/transactions">Журнал транзакцій</a></li>
                <li><a href="/forecast" class="active">Прогноз</a></li>
            </ul>
        </nav>
    </aside>
    <main class="dashboard-content">
        <h1>Прогноз</h1>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Місяць</th>
                <th>Фактичний дохід</th>
                <th>Згладжене значення доходів</th>
                <th>Витрати</th>
                <th>Згладжене значення витрат</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="month : ${months}">
                <td th:text="${month.month}"></td>
                <td th:text="${month.actualIncome}"></td>
                <td th:text="${month.smoothedIncome}"></td>
                <td th:text="${month.expenses}"></td>
                <td th:text="${month.smoothedExpenses}"></td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
