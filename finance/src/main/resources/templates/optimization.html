<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Оптимізація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link th:href="@{/css/index.css}" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h3>Персональні фінанси</h3>
        <nav>
            <ul>
                <li><a href="/">Витрати</a></li>
                <li><a href="/income">Доходи</a></li>
                <li><a href="/assets">Активи</a></li>
                <li><a href="/transactions">Журнал транзакцій</a></li>
                <li><a href="/forecast">Прогноз</a></li>
                <li><a href="/optimization" class="active">Оптимізація</a></li>
                <li><a href="/planning">Планування бюджету</a></li>
                <li><a href="/assistant">Помічник</a></li>
            </ul>
        </nav>
    </aside>
    <main class="dashboard-content">
        <h1>Оптимізація</h1>
        <div class="alert alert-success" role="status" th:if="${saved}">Дані збережено.</div>
        <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <form method="post" th:action="@{/optimization}" th:object="${settings}">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label" for="income">Доходи</label>
                <input class="form-control" type="number" min="0" step="1000"
                       th:field="*{income}" id="income" aria-label="Доходи">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="mandatoryExpenses">Обов’язкові витрати</label>
                <input class="form-control" type="number" min="0" step="1000"
                       th:field="*{mandatoryExpenses}" id="mandatoryExpenses"
                       aria-label="Обов’язкові витрати">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="availableFunds">Доступні кошти</label>
                <input class="form-control" type="text" id="availableFunds"
                       th:value="*{availableFunds}" placeholder="—" readonly>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                <tr>
                    <th scope="col">Категорія</th>
                    <th scope="col">Обмеження</th>
                    <th scope="col">Пріоритет</th>
                    <th scope="col">Бажано</th>
                    <th scope="col">Оптимально</th>
                    <th scope="col">Результат</th>
                    <th scope="col">Відхилення</th>
                    <th scope="col">Дії</th>
                </tr>
                </thead>
                <tbody id="optimization-categories">
                <tr th:each="category, stat : *{categories}">
                    <td><input class="form-control" type="text" required
                               th:field="*{categories[__${stat.index}__].name}"
                               aria-label="Категорія"></td>
                    <td><input class="form-control" type="number" min="0" step="1"
                               th:field="*{categories[__${stat.index}__].limit}"
                               aria-label="Обмеження"></td>
                    <td><input class="form-control" type="number" min="1" max="5" step="1" required
                               th:field="*{categories[__${stat.index}__].priority}"
                               aria-label="Пріоритет"></td>
                    <td><input class="form-control" type="number" min="0" step="1"
                               th:field="*{categories[__${stat.index}__].desired}"
                               aria-label="Бажано"></td>
                    <td><input class="form-control" type="number" step="1"
                               th:field="*{categories[__${stat.index}__].optimal}"
                               placeholder="—" aria-label="Оптимально" readonly></td>
                    <td><input class="form-control" type="text" readonly
                               th:field="*{categories[__${stat.index}__].result}"
                               placeholder="—" aria-label="Результат"></td>
                    <td><input class="form-control" type="number" step="1"
                               th:field="*{categories[__${stat.index}__].deviation}"
                               placeholder="—" aria-label="Відхилення" readonly></td>
                    <td class="text-center"><button class="btn btn-danger delete-optimization-category"
                                                    type="button" aria-label="Видалити категорію">Видалити</button></td>
                </tr>
                </tbody>
                <tfoot class="table-light">
                <tr>
                    <th scope="row">Разом</th>
                    <td class="text-center optimization-total" data-total-for="limit">—</td>
                    <td></td>
                    <td class="text-center optimization-total" data-total-for="desired">—</td>
                    <td><input class="form-control" type="number" step="1"
                               th:field="*{totalOptimal}" placeholder="—"
                               aria-label="Оптимально: разом" readonly></td>
                    <td class="text-center">—</td>
                    <td><input class="form-control" type="number" step="1"
                               th:field="*{totalDeviation}" placeholder="—"
                               aria-label="Відхилення: разом" readonly></td>
                    <td class="text-center">—</td>
                </tr>
                </tfoot>
            </table>
        </div>
        <button class="btn btn-success align-self-start" id="add-optimization-category" type="button">
            Додати категорію
        </button>
        <button class="btn btn-primary align-self-start" type="submit">Зберегти</button>
        </form>
    </main>
</div>
<script th:src="@{/js/optimization.js}"></script>
</body>
</html>
